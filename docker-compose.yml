services:
  postgres:
    image: postgres:16-alpine
    container_name: rumaal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-BMS}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-BMS}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rumaal-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rumaal-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-BMS}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-123}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-c3VwZXItc2VjdXJlLWJvb2steW91ci1zaG93LWp3dC1rZXktZm9yLXRlc3RpbmctcHVycG9zZXMtb25seQ==}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-604800000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80,http://localhost:3000,http://frontend}
      APP_TMDB_API_KEY: ${APP_TMDB_API_KEY:-}
      APP_TMDB_REGION: ${APP_TMDB_REGION:-IN}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - rumaal-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rumaal-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - rumaal-net

volumes:
  postgres_data:
    driver: local

networks:
  rumaal-net:
    driver: bridge
